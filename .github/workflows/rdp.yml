name: Ubuntu RDP with Ant Media

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preparing Environment & Desktop GUI
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install --assume-yes xfce4 desktop-base xfce4-terminal xbase-clients xserver-xorg-video-dummy xauth
          sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'
          wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo apt install --assume-yes ./chrome-remote-desktop_current_amd64.deb

      - name: Setting Up Chrome Remote Desktop
        env:
          CRD_AUTH: ${{ secrets.CRD_CODE }}
        run: |
          printf '123456\n123456\n' | eval "$CRD_AUTH" --pin=123456

      - name: Keep Alive (Running 6 Hours)
        run: |
          sleep 21600
